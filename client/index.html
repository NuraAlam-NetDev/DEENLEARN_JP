<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon set: crisp SVG for modern browsers, PNG fallbacks, and an iOS home-screen icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#136446" />
    <title>Deenlearn</title>
    <script>(function(){try{var m=localStorage.getItem('deenlearn-theme')||'system';var d=m==='dark'||(m==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark');}catch(e){}})();</script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f6b4f" />

    <!-- Fonts: Noto Sans (+ Bengali) for UI, Amiri + Noto Naskh Arabic for Arabic and headings -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400..700&family=Noto+Nastaliq+Urdu:wght@400..700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400..700&family=Noto+Sans+Devanagari:wght@400..700&family=Noto+Sans+JP:wght@400..700&family=Noto+Sans+SC:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Each language uses a font made for its script */
      :lang(bn) { font-family: 'Noto Sans Bengali', 'Noto Sans', sans-serif; }
      :lang(ja) { font-family: 'Noto Sans JP', 'Noto Sans', sans-serif; }
      :lang(zh) { font-family: 'Noto Sans SC', 'Noto Sans', sans-serif; }
      :lang(hi) { font-family: 'Noto Sans Devanagari', 'Noto Sans', sans-serif; }
      :lang(ar) { font-family: 'Noto Naskh Arabic', 'Amiri', sans-serif; }
      :lang(ur) { font-family: 'Noto Nastaliq Urdu', 'Noto Naskh Arabic', sans-serif; line-height: 2; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
